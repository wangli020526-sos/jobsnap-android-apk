name: Build and Release JobSnap Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Direct Mobile Installation
        run: cp app/build/outputs/apk/debug/app-debug.apk JobSnap-v1.0.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobSnap-Android-APK
          path: JobSnap-v1.0.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "职捕 JobSnap 安卓安装包 v1.0.${{ github.run_number }} (手机点击下方 .apk 直接安装)"
          body: |
            ### 📱 手机端一键下载安装说明
            请直接点击下方 **Assets** 中的 **`JobSnap-v1.0.apk`** 下载到安卓手机并点击安装（无需解压）。
            安装后打开 App，依次点击顶部「1.开启悬浮窗权限」和「2.开启无障碍抓词」，即可在 BOSS直聘 / 猎聘 上方使用右侧 4 按钮悬浮栏！
          files: JobSnap-v1.0.apk
